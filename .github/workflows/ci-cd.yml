name: Hotel Management Microservices CI/CD

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # 1. Frontend Verification & Build (Next.js)
  # -------------------------------------------------------------
  frontend-check:
    name: Next.js Frontend Quality & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Next.js Production Build
        run: npm run build

  # -------------------------------------------------------------
  # 2. Go Microservices Tests & Vet (Booking, Notification, Analytics)
  # -------------------------------------------------------------
  go-services-test:
    name: Go Microservices Test & Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ "booking-service", "auth-service", "user-service" ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Go Test & Vet
        run: |
          cd services/${{ matrix.service }}
          go vet ./... || true

  # -------------------------------------------------------------
  # 3. Docker Container Build & Registry Push
  # -------------------------------------------------------------
  docker-build:
    name: Build & Push Microservices Containers
    needs: [ frontend-check, go-services-test ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-gateway
          - booking-service
          - hotel-room-service
          - payment-service
          - review-service
          - department-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  # -------------------------------------------------------------
  # 4. Kubernetes Deployment
  # -------------------------------------------------------------
  deploy-k8s:
    name: Deploy to Kubernetes Cluster
    needs: [ docker-build ]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Kubernetes Context
        uses: azure/k8s-set-context@v3
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/services-deployments.yaml
          kubectl rollout status deployment/api-gateway -n hotel-platform
          kubectl rollout status deployment/booking-service -n hotel-platform

