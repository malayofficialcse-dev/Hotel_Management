apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-payment-config
  namespace: hotel-platform
data:
  BOOKING_PORT: "8005"
  PAYMENT_PORT: "8006"
  BOOKING_SERVICE_URL: "http://booking-service:8005"
  PAYMENT_SERVICE_URL: "http://payment-service:8006"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: hotel-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
    spec:
      containers:
        - name: booking-service
          image: hotel-booking-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8005
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: booking-payment-config
                  key: BOOKING_PORT
            - name: PAYMENT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: booking-payment-config
                  key: PAYMENT_SERVICE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: BOOKING_DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: REDIS_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: RABBITMQ_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: AUTH_SERVICE_URL
            - name: HOTEL_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: HOTEL_SERVICE_URL
            - name: ROOM_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: HOTEL_SERVICE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  namespace: hotel-platform
spec:
  type: ClusterIP
  selector:
    app: booking-service
  ports:
    - name: http
      port: 8005
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: hotel-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: hotel-payment-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8006
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: booking-payment-config
                  key: PAYMENT_PORT
            - name: BOOKING_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: booking-payment-config
                  key: BOOKING_SERVICE_URL
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: PAYMENT_DATABASE_URL
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: RABBITMQ_URL
            - name: AUTH_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: AUTH_SERVICE_URL
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: STRIPE_SECRET_KEY
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: booking-payment-secrets
                  key: STRIPE_WEBHOOK_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /api/v1/payments/health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/v1/payments/health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/payments/health
              port: http
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: hotel-platform
spec:
  type: ClusterIP
  selector:
    app: payment-service
  ports:
    - name: http
      port: 8006
      targetPort: http
