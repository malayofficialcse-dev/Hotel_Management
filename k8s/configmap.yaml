apiVersion: v1
kind: ConfigMap
metadata:
  name: hotel-platform-config
  namespace: hotel-platform
data:
  NODE_ENV: "production"
  CLIENT_URL: "https://yourhotelapp.vercel.app"
  REDIS_URL: "redis://redis-service:6379"
  RABBITMQ_URL: "amqp://hotel_admin:hotel_rabbit_pass@rabbitmq-service:5672"
  AUTH_SERVICE_URL: "http://auth-service:8001"
  USER_SERVICE_URL: "http://user-guest-service:8002"
  OPERATIONS_SERVICE_URL: "http://operations-service:8020"
  HOTEL_SERVICE_URL: "http://operations-service:8020"
  ROOM_SERVICE_URL: "http://operations-service:8020"
  EMPLOYEE_SERVICE_URL: "http://operations-service:8020"
  DEPARTMENT_SERVICE_URL: "http://operations-service:8020"
  HOUSEKEEPING_SERVICE_URL: "http://operations-service:8020"
  REVIEW_SERVICE_URL: "http://operations-service:8020"
  BOOKING_SERVICE_URL: "http://booking-service:8005"
  PAYMENT_SERVICE_URL: "http://payment-service:8006"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8010"
  ANALYTICS_SERVICE_URL: "http://analytics-service:8011"
  CATALOG_MONGODB_URI: "mongodb://mongo-service:27017/hotel_catalog"
  DEPARTMENT_MONGODB_URI: "mongodb://mongo-service:27017/hotel_departments"
  HOUSEKEEPING_MONGODB_URI: "mongodb://mongo-service:27017/hotel_housekeeping"
  REVIEW_MONGODB_URI: "mongodb://mongo-service:27017/hotel_reviews"
