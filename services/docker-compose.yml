version: "3.9"

services:
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 1. CORE DATA STORES & MESSAGE BROKER
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  postgres:
    image: postgres:16-alpine
    container_name: hotel-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7-jammy
    container_name: hotel-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    restart: always
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hotel-rabbitmq
    restart: always
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Dashboard UI
    environment:
      RABBITMQ_DEFAULT_USER: hotel_admin
      RABBITMQ_DEFAULT_PASS: hotel_rabbit_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # 2. NESTJS SERVICES (Prisma / Mongoose)
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

  # API Gateway [NestJS]
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: hotel-api-gateway
    restart: always
    ports: ["8000:8000"]
    environment:
      PORT: 8000
      JWT_ACCESS_SECRET: hotel-jwt-secret-key-2026
      CLIENT_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://host.docker.internal:8001
      USER_SERVICE_URL: http://user-service:8002
      OPERATIONS_SERVICE_URL: http://operations-service:8020
      BOOKING_SERVICE_URL: http://booking-service:8005
      PAYMENT_SERVICE_URL: http://host.docker.internal:8006
      NOTIFICATION_SERVICE_URL: http://notification-service:8010
      ANALYTICS_SERVICE_URL: http://analytics-service:8011
    depends_on:
      - auth-service
      - operations-service
      - booking-service

  # Authentication Service [NestJS + PostgreSQL (Prisma)]
  auth-service:
    build: ./auth-service
    container_name: hotel-auth-service
    restart: always
    ports: ["8001:8001"]
    environment:
      PORT: 8001
      DATABASE_URL: ${DATABASE_URL}
      EMPLOYEE_SERVICE_URL: http://operations-service:8020
      JWT_ACCESS_SECRET: hotel-jwt-access-secret-2026
      JWT_REFRESH_SECRET: hotel-jwt-refresh-secret-2026
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://hotel_admin:hotel_rabbit_pass@rabbitmq:5672
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  # Guest / User Management Service [NestJS + PostgreSQL]
  user-service:
    build: ./user-service
    container_name: hotel-user-service
    restart: always
    ports: ["8002:8002"]
    environment:
      PORT: 8002
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SERVICE_URL: http://host.docker.internal:8001
    depends_on:
      postgres: { condition: service_healthy }

  # Payment Service [NestJS + PostgreSQL (Prisma)]
  payment-service:
    build: ./payment-service
    container_name: hotel-payment-service
    restart: always
    ports: ["8006:8006"]
    environment:
      PORT: 8006
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://hotel_admin:hotel_rabbit_pass@rabbitmq:5672
      BOOKING_SERVICE_URL: http://booking-service:8005
      STRIPE_SECRET_KEY: sk_test_mock_stripe_key
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Unified Express Operations Service
  operations-service:
    build:
      context: ..
      dockerfile: services/operations-service/Dockerfile
    container_name: hotel-operations-service
    restart: always
    ports: ["8020:8020"]
    env_file: ./operations-service/.env
    environment:
      PORT: 8020
      DATABASE_URL: ${DATABASE_URL}
      CATALOG_MONGODB_URI: mongodb://mongo:27017/hotel_catalog
      DEPARTMENT_MONGODB_URI: mongodb://mongo:27017/hotel_departments
      HOUSEKEEPING_MONGODB_URI: mongodb://mongo:27017/hotel_housekeeping
      REVIEW_MONGODB_URI: mongodb://mongo:27017/hotel_reviews
      AUTH_SERVICE_URL: http://auth-service:8001
      BOOKING_SERVICE_URL: http://booking-service:8005
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

  # 3. GO MICROSERVICES (pgx / gRPC / Concurrency)
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

  # Booking Service [Go + PostgreSQL + Redis (Distributed Lock & 10-Min Hold)]
  booking-service:
    build: ./booking-service
    container_name: hotel-booking-service-go
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always
    ports:
      - "8005:8005"   # HTTP REST
      - "50051:50051" # gRPC
    environment:
      PORT: 8005
      GRPC_PORT: 50051
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://hotel_admin:hotel_rabbit_pass@rabbitmq:5672
      HOTEL_SERVICE_URL: http://host.docker.internal:8020
      ROOM_SERVICE_URL: http://host.docker.internal:8020
      AUTH_SERVICE_URL: http://host.docker.internal:8001
      PAYMENT_SERVICE_URL: http://host.docker.internal:8006
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # Notification Service [Go + RabbitMQ Consumer + Mongo/Postgres]
  notification-service:
    build: ./notification-service
    container_name: hotel-notification-service-go
    restart: always
    ports:
      - "8010:8010"
      - "50052:50052" # gRPC
    environment:
      PORT: 8010
      GRPC_PORT: 50052
      RABBITMQ_URL: amqp://hotel_admin:hotel_rabbit_pass@rabbitmq:5672
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://mongo:27017/hotel_notifications
    depends_on:
      rabbitmq: { condition: service_healthy }

  # Analytics Service [Go + Postgres/Redis]
  analytics-service:
    build: ./analytics-service
    container_name: hotel-analytics-service-go
    restart: always
    ports:
      - "8011:8011"
    environment:
      PORT: 8011
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://hotel_admin:hotel_rabbit_pass@rabbitmq:5672
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # AI Concierge & Smart Guest Assistant Service [Pinecone + LangGraph + Gemini]
  ai-service:
    build: ./ai-service
    container_name: hotel-ai-service
    restart: always
    ports:
      - "8013:8013"
    environment:
      PORT: 8013
      NODE_ENV: production
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_INDEX: ${PINECONE_INDEX:-stayease-hotels}
      PINECONE_HOST: ${PINECONE_HOST}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-false}
      LANGCHAIN_API_KEY: ${LANGCHAIN_API_KEY}
      LANGCHAIN_PROJECT: ${LANGCHAIN_PROJECT:-stayease-ai-service}
      API_GATEWAY_URL: http://api-gateway:8000
      HOTEL_SERVICE_URL: http://operations-service:8020
      HOUSEKEEPING_SERVICE_URL: http://operations-service:8020

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  rabbitmq_data:

