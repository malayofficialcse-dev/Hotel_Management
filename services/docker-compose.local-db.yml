version: "3.9"

# =============================================================
# StayEase Services - Docker Compose with Local Databases
# Connects to host's local PostgreSQL (Port 5432) & local MongoDB (Port 27017)
# PostgreSQL Password: "Malay@21" (URL-encoded as Malay%4021)
# =============================================================

services:
  # â”€â”€ In-Memory Cache & Message Broker â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  redis:
    image: redis:7-alpine
    container_name: stayease-redis
    restart: always
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: stayease-rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: hotel_admin
      RABBITMQ_DEFAULT_PASS: hotel_rabbit_pass

  # â”€â”€ API Gateway (NestJS :8000) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    container_name: stayease-api-gateway
    restart: always
    ports: ["8000:8000"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8000
      JWT_ACCESS_SECRET: hotel-jwt-secret-key-2026
      CLIENT_URL: http://localhost:3000
      AUTH_SERVICE_URL: http://host.docker.internal:8001
      USER_SERVICE_URL: http://user-service:8002
      OPERATIONS_SERVICE_URL: http://operations-service:8020
      BOOKING_SERVICE_URL: http://booking-service:8005
      PAYMENT_SERVICE_URL: http://host.docker.internal:8006




      NOTIFICATION_SERVICE_URL: http://notification-service:8010
      ANALYTICS_SERVICE_URL: http://analytics-service:8011
    depends_on:
      - auth-service
      - operations-service
      - booking-service

  # â”€â”€ 1. Auth Service (NestJS + Local PostgreSQL :8001) â”€â”€â”€â”€â”€â”€â”€â”€
  auth-service:
    build: ./auth-service
    container_name: stayease-auth-service
    restart: always
    ports: ["8001:8001"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8001
      DATABASE_URL: ${DATABASE_URL}
      EMPLOYEE_SERVICE_URL: http://operations-service:8020
      JWT_ACCESS_SECRET: hotel-jwt-access-secret-2026
      JWT_REFRESH_SECRET: hotel-jwt-refresh-secret-2026
      REDIS_URL: redis://redis:6379

  # â”€â”€ 2. User Service (NestJS + Local PostgreSQL :8002) â”€â”€â”€â”€â”€â”€â”€â”€
  user-service:
    build: ./user-service
    container_name: stayease-user-service
    restart: always
    ports: ["8002:8002"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8002
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SERVICE_URL: http://host.docker.internal:8001

  # Unified hotel and operations APIs (:8020)
  operations-service:
    build:
      context: ..
      dockerfile: services/operations-service/Dockerfile
    container_name: stayease-operations-service
    restart: always
    ports: ["8020:8020"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file: ./operations-service/.env
    environment:
      PORT: 8020
      DATABASE_URL: ${DATABASE_URL}
      CATALOG_MONGODB_URI: mongodb://host.docker.internal:27017/hotel_catalog
      DEPARTMENT_MONGODB_URI: mongodb://host.docker.internal:27017/hotel_departments
      HOUSEKEEPING_MONGODB_URI: mongodb://host.docker.internal:27017/hotel_housekeeping
      REVIEW_MONGODB_URI: mongodb://host.docker.internal:27017/hotel_reviews
      AUTH_SERVICE_URL: http://auth-service:8001
      BOOKING_SERVICE_URL: http://booking-service:8005
      RABBITMQ_URL: amqp://hotel_admin:hotel_rabbit_pass@rabbitmq:5672
      CLIENT_URL: http://localhost:3000
  booking-service:
    build: ./booking-service
    container_name: stayease-booking-service
    restart: always
    ports:
      - "8005:8005"
      - "50051:50051"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8005
      GRPC_PORT: 50051
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://hotel_admin:hotel_rabbit_pass@rabbitmq:5672
      HOTEL_SERVICE_URL: http://host.docker.internal:8020
      ROOM_SERVICE_URL: http://host.docker.internal:8020
      AUTH_SERVICE_URL: http://host.docker.internal:8001
      PAYMENT_SERVICE_URL: http://host.docker.internal:8006
    depends_on:
      - redis
      - rabbitmq

  # â”€â”€ 6. Payment Service (NestJS + Local PostgreSQL :8006) â”€â”€â”€â”€â”€
  payment-service:
    build: ./payment-service
    container_name: stayease-payment-service
    restart: always
    ports: ["8006:8006"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8006
      DATABASE_URL: ${DATABASE_URL}
      RABBITMQ_URL: amqp://hotel_admin:hotel_rabbit_pass@rabbitmq:5672
      BOOKING_SERVICE_URL: http://booking-service:8005
      AUTH_SERVICE_URL: http://host.docker.internal:8001
      STRIPE_SECRET_KEY: sk_test_mock_stripe_key
    depends_on:
      - rabbitmq


  notification-service:
    build: ./notification-service
    container_name: stayease-notification-service
    restart: always
    ports:
      - "8010:8010"
      - "50052:50052"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8010
      GRPC_PORT: 50052
      RABBITMQ_URL: amqp://hotel_admin:hotel_rabbit_pass@rabbitmq:5672
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: mongodb://host.docker.internal:27017/hotel_notifications
    depends_on:
      - rabbitmq

  # â”€â”€ 11. Analytics Service (Go + Local PostgreSQL :8011) â”€â”€â”€â”€â”€â”€
  analytics-service:
    build: ./analytics-service
    container_name: stayease-analytics-service
    restart: always
    ports: ["8011:8011"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8011
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://hotel_admin:hotel_rabbit_pass@rabbitmq:5672
    depends_on:
      - redis
      - rabbitmq


